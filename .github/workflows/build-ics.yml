name: Build & publish handball.net ICS

on:
  schedule:
    - cron: "0 */6 * * *"   # alle 6 Stunden (Kalender-Apps aktualisieren ohnehin träge)
  workflow_dispatch: {}       # manuell auslösbar
  push:
    branches: [main]          # teams.json geändert -> Feed sofort neu

# Nur ein Lauf gleichzeitig; laufende Deploys nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # handball.net braucht keinen Login -> keine Secrets, alles über Variables.
      - name: Feed erzeugen
        env:
          SEASON_START: ${{ vars.SEASON_START || '2026-08-01' }}
          SEASON_END: ${{ vars.SEASON_END || '2027-06-30' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Europe/Berlin' }}
          CALENDAR_NAME: ${{ vars.CALENDAR_NAME || 'Handball' }}
          MATCH_DURATION_MIN: ${{ vars.MATCH_DURATION_MIN || '120' }}
        run: python -m src.main

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
